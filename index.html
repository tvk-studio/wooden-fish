<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>木魚堂 · Wooden Fish</title>
<link rel="manifest" href="mokugyo-manifest.json">
<link rel="apple-touch-icon" href="mokugyo-apple-touch-icon.png">
<meta name="theme-color" content="#1a0708">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="木鱼堂">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --gold: #d8ab52;
    --gold-bright: #f2d38a;
    --gold-dim: #c69a4c;
    --ink: #e9d5b1;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; width:100%; min-height:100%;
    background:#171313;
    font-family:"Noto Serif SC",serif;
    color:var(--ink);
    overscroll-behavior:none;
  }
  a{ color:var(--gold); text-decoration:none; }
  button{ font-family:inherit; }
  #stage{
    position:relative;
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    overflow:hidden;
    background:radial-gradient(120% 78% at 50% -8%,#4a1a19 0%,#2c0d0f 46%,#1a0708 100%);
  }
  #stage::before{
    content:"";
    position:absolute; inset:0; opacity:.5; pointer-events:none;
    background:radial-gradient(60% 32% at 50% 8%,rgba(216,171,82,.16),transparent 70%);
  }
  #app{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    padding-bottom:104px;
    box-sizing:border-box;
  }
  #modalRoot{ position:relative; z-index:30; }

  @keyframes omSway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
  @keyframes omRise{0%{opacity:0;transform:translateY(0) scale(.85)}18%{opacity:1}100%{opacity:0;transform:translateY(-96px) scale(1.05)}}
  @keyframes omRipple{0%{opacity:.55;transform:scale(.72)}100%{opacity:0;transform:scale(1.5)}}
  @keyframes omSmoke{0%{opacity:0;transform:translate(0,0) scale(.6)}25%{opacity:.5}100%{opacity:0;transform:translate(14px,-70px) scale(1.9)}}
  @keyframes omSeal{0%{opacity:0;transform:scale(2.1) rotate(-14deg)}55%{opacity:1;transform:scale(.92) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0deg)}}
  @keyframes omUnfurl{0%{opacity:0;transform:scaleY(.04);transform-origin:top}60%{opacity:1}100%{opacity:1;transform:scaleY(1);transform-origin:top}}
  @keyframes omEmber{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes omLampGlow{0%{opacity:0;transform:scale(.7)}22%{opacity:1;transform:scale(1.04)}72%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.02)}}
  @keyframes omLampFlare{0%{opacity:0}20%{opacity:.85}100%{opacity:0}}

  /* --- header --- */
  .hdr-rule{ display:flex; align-items:center; justify-content:center; gap:12px; color:var(--gold-dim); padding-top:28px; }
  .hdr-rule .line{ height:1px; width:44px; background:linear-gradient(90deg,transparent,rgba(198,154,76,.6)); }
  .hdr-rule .line.r{ background:linear-gradient(270deg,transparent,rgba(198,154,76,.6)); }
  .hdr-rule .label{ font-size:11px; letter-spacing:.42em; }
  .hall-input{ min-width:70px; max-width:230px; padding:2px 0; text-align:center; font-family:'Noto Serif SC',serif; font-size:11px; letter-spacing:.42em; color:var(--gold-dim); background:transparent; border:none; outline:none; cursor:text; }
  .page-title{ font-size:11px; letter-spacing:.42em; color:var(--gold-dim); text-align:center; padding-top:28px; }
  .page-sub{ margin:16px 22px 0; font-size:11.5px; line-height:1.8; color:rgba(233,213,177,.45); text-align:center; }

  /* --- altar --- */
  .today-wrap{ margin-top:34px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .today-label{ font-size:9.5px; letter-spacing:.3em; color:rgba(233,213,177,.45); }
  .today-num{ font-size:62px; font-weight:600; line-height:1; color:var(--gold-bright); text-shadow:0 0 26px rgba(216,171,82,.35); font-variant-numeric:tabular-nums; }
  .total-line{ font-size:11px; letter-spacing:.16em; color:rgba(233,213,177,.4); }

  .fish-area{ position:relative; margin-top:26px; display:flex; flex-direction:column; align-items:center; padding:0 26px; }
  .floater{ position:absolute; top:24px; font-size:14px; color:var(--gold-bright); letter-spacing:.1em; animation:omRise 1.15s ease-out forwards; pointer-events:none; z-index:5; }
  .fish-btn{ position:relative; width:196px; height:196px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .11s ease-out; border:none; background:none; padding:0; }
  .fish-btn:active{ transform:scale(.945); }
  .ripple{ position:absolute; width:196px; height:196px; border-radius:50%; border:1px solid rgba(216,171,82,.5); animation:omRipple .9s ease-out forwards; }
  .fish-glow{ position:absolute; width:176px; height:176px; border-radius:50%; background:radial-gradient(60% 55% at 50% 30%,rgba(216,171,82,.13),transparent 72%); }
  .fish-body{ position:relative; width:150px; height:112px; border-radius:50% 50% 46% 46%/56% 56% 44% 44%; background:radial-gradient(70% 80% at 34% 26%,#8a5a2b 0%,#5d3418 52%,#331a0d 100%); box-shadow:0 18px 34px rgba(0,0,0,.5),inset 0 -8px 18px rgba(0,0,0,.45),inset 0 6px 12px rgba(216,171,82,.18); }
  .fish-mouth{ position:absolute; left:22px; right:22px; top:58%; height:9px; border-radius:9px; background:linear-gradient(180deg,#1b0d06,#2e1a0d); box-shadow:inset 0 2px 3px rgba(0,0,0,.8); }
  .fish-shine{ position:absolute; left:30px; top:22px; width:36px; height:14px; border-radius:50%; background:rgba(255,235,200,.13); filter:blur(3px); }
  .tap-hint{ margin-top:14px; font-size:9.5px; letter-spacing:.34em; color:rgba(233,213,177,.34); }

  .active-card{ margin-top:16px; width:236px; padding:12px 16px; box-sizing:border-box; border-radius:8px; border:1px solid rgba(216,171,82,.22); background:linear-gradient(180deg,rgba(216,171,82,.07),transparent); cursor:pointer; text-align:left; }
  .active-card-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .active-card-top .lbl{ font-size:9px; letter-spacing:.28em; color:rgba(233,213,177,.42); }
  .active-card-top .frac{ font-size:10px; letter-spacing:.1em; color:rgba(233,213,177,.4); font-variant-numeric:tabular-nums; }
  .active-text{ margin-top:7px; font-size:14px; letter-spacing:.18em; }
  .active-track{ margin-top:9px; height:3px; border-radius:3px; background:rgba(216,171,82,.15); overflow:hidden; }
  .active-fill{ height:100%; border-radius:3px; background:linear-gradient(90deg,#c69a4c,#f2d38a); transition:width .3s ease; }

  .celebrate-overlay{ position:absolute; inset:-40px -26px; z-index:14; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .celebrate-flare{ position:absolute; inset:0; background:radial-gradient(50% 40% at 50% 46%,rgba(230,136,60,.5),transparent 72%); animation:omLampFlare 2.4s ease-out forwards; }
  .celebrate-card{ position:relative; padding:20px 26px; border-radius:10px; border:1px solid rgba(242,211,138,.45); background:rgba(26,7,8,.86); backdrop-filter:blur(6px); text-align:center; animation:omLampGlow 2.4s ease-out forwards; }
  .celebrate-dot{ width:10px; height:10px; margin:0 auto; border-radius:50%; background:#e6883c; box-shadow:0 0 18px 6px rgba(230,136,60,.65); }
  .celebrate-text{ margin-top:12px; font-size:16px; letter-spacing:.22em; color:var(--gold-bright); }
  .celebrate-sub{ margin-top:7px; font-size:9.5px; letter-spacing:.24em; color:rgba(233,213,177,.5); }

  .incense{ position:absolute; right:-4px; bottom:6px; width:64px; height:124px; z-index:8; cursor:pointer; background:none; border:none; padding:0; }
  .incense-stick{ position:absolute; bottom:32px; left:30px; width:3px; background:linear-gradient(180deg,#6d4a2a,#8a6a44); transition:height 1s linear; }
  .incense-ember{ position:absolute; left:31px; width:5px; height:5px; border-radius:50%; background:#e6883c; box-shadow:0 0 10px 3px rgba(230,136,60,.6); animation:omEmber 2.6s ease-in-out infinite; transition:bottom 1s linear; }
  .incense-smoke{ position:absolute; width:9px; height:9px; border-radius:50%; background:rgba(236,224,196,.5); filter:blur(4px); animation:omSmoke 5.2s linear infinite; transition:bottom 1s linear; }
  .incense-holder{ position:absolute; bottom:26px; left:18px; width:28px; height:9px; border-radius:4px 4px 6px 6px; background:linear-gradient(180deg,#7b2f28,#4a1a16); }
  .incense-label{ position:absolute; bottom:0; left:0; width:64px; text-align:center; font-size:9.5px; letter-spacing:.1em; font-variant-numeric:tabular-nums; }

  .burn-toast{ position:absolute; left:26px; right:70px; bottom:0; z-index:9; padding:13px 16px; border-radius:8px; border:1px solid rgba(216,171,82,.3); background:rgba(26,7,8,.9); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .burn-toast .t1{ font-size:12.5px; color:var(--gold-bright); letter-spacing:.1em; }
  .burn-toast .t2{ font-size:10px; color:rgba(233,213,177,.45); letter-spacing:.08em; margin-top:4px; }
  .burn-toast button{ padding:13px 18px; border:1px solid rgba(216,171,82,.4); border-radius:4px; font-size:11px; letter-spacing:.16em; color:var(--gold); background:none; cursor:pointer; }

  .beam-wrap{ position:relative; margin-top:34px; padding:0 26px 24px; }
  .beam{ height:11px; border-radius:3px; background:linear-gradient(180deg,#a3712f,#5f3a17 60%,#3a2210); box-shadow:0 5px 14px rgba(0,0,0,.5); }
  .plaques{ display:flex; justify-content:space-between; gap:12px; padding:0 10px; }
  .plaque-hang{ display:flex; flex-direction:column; align-items:center; transform-origin:top center; animation:omSway 4.6s ease-in-out infinite; }
  .plaque-hang.p2{ animation-duration:5.4s; animation-delay:.7s; }
  .plaque-hang.p3{ animation-duration:4.1s; animation-delay:1.3s; }
  .cord{ width:1px; height:16px; background:rgba(233,213,177,.4); }
  .plaque{ position:relative; width:82px; padding:16px 0 18px; text-align:center; cursor:pointer; border-radius:6px; clip-path:polygon(50% 0,100% 15%,100% 100%,0 100%,0 15%); background:linear-gradient(180deg,#c08d52,#8a5c2e 55%,#6d4520); box-shadow:0 8px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,235,200,.25); border:none; }
  .plaque .zh{ font-size:15px; letter-spacing:.2em; color:#3a2211; writing-mode:vertical-rl; margin:0 auto; }
  .plaque .en{ margin-top:8px; font-size:9px; letter-spacing:.2em; color:#f3e2c4; text-shadow:0 1px 2px rgba(0,0,0,.5); }
  .seal{ position:absolute; top:26px; left:50%; margin-left:-27px; width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:radial-gradient(60% 60% at 40% 30%,#c4352c,#8e1f1a); border:2px solid rgba(255,220,200,.28); box-shadow:0 6px 14px rgba(0,0,0,.5); animation:omSeal .5s cubic-bezier(.2,1.4,.4,1) forwards; }
  .seal span{ font-size:17px; color:#f6e2c8; letter-spacing:.04em; }

  .sheet{ position:absolute; left:10px; right:10px; bottom:118px; padding:20px 22px 22px; border-radius:4px; background:linear-gradient(180deg,#efe4c8,#ddcda8); box-shadow:0 22px 44px rgba(0,0,0,.55); animation:omUnfurl .42s ease-out forwards; z-index:15; }
  .sheet-head{ display:flex; align-items:baseline; justify-content:space-between; }
  .sheet-title{ font-size:15px; color:#4a3418; letter-spacing:.14em; }
  .sheet-close{ font-size:12px; color:rgba(74,52,24,.6); cursor:pointer; letter-spacing:.1em; padding:12px 14px; margin:-12px -14px; background:none; border:none; }
  .check-row{ margin-top:12px; display:flex; align-items:center; gap:10px; min-height:44px; cursor:pointer; background:none; border:none; padding:0; text-align:left; }
  .check-box{ width:18px; height:18px; border:1px solid rgba(74,52,24,.5); border-radius:2px; display:flex; align-items:center; justify-content:center; font-size:13px; color:#8e1f1a; flex:none; }
  .check-label{ font-size:12px; color:rgba(74,52,24,.8); letter-spacing:.06em; }
  .check-col{ display:flex; flex-direction:column; gap:3px; }
  .check-sub{ font-size:10px; color:rgba(74,52,24,.5); letter-spacing:.04em; }
  .sheet-rule{ margin-top:14px; height:1px; background:rgba(74,52,24,.16); }
  .sheet-note{ margin-top:10px; font-size:10px; line-height:1.6; color:rgba(74,52,24,.55); }

  .reminder-list{ margin-top:12px; display:flex; flex-direction:column; }
  .reminder-row{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid rgba(74,52,24,.14); }
  .reminder-toggle{ display:flex; align-items:center; gap:10px; flex:1; min-height:44px; min-width:0; cursor:pointer; background:none; border:none; padding:0; text-align:left; }
  .reminder-time-big{ font-size:28px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .reminder-label-input{ margin-top:3px; width:88px; padding:2px 0; font-family:'Noto Serif SC',serif; font-size:10px; letter-spacing:.16em; color:rgba(74,52,24,.75); background:transparent; border:none; border-bottom:1px solid rgba(74,52,24,.28); outline:none; display:block; }
  .reminder-adj{ flex:none; width:34px; height:34px; display:flex; align-items:center; justify-content:center; border:1px solid rgba(74,52,24,.28); border-radius:3px; font-size:14px; color:rgba(74,52,24,.7); cursor:pointer; background:none; }
  .reminder-remove{ flex:none; width:34px; height:34px; display:flex; align-items:center; justify-content:center; font-size:11px; letter-spacing:.06em; color:rgba(74,52,24,.45); cursor:pointer; background:none; border:none; }
  .add-reminder-btn{ margin-top:12px; width:100%; padding:11px 0; text-align:center; border:1px dashed rgba(74,52,24,.35); border-radius:4px; font-size:11px; letter-spacing:.2em; color:rgba(74,52,24,.7); cursor:pointer; background:none; }

  /* --- merit --- */
  .scroll-pad{ padding:0 26px 24px; overflow:auto; }
  .merit-card{ margin-top:28px; padding:22px; border-radius:10px; border:1px solid rgba(216,171,82,.24); background:linear-gradient(180deg,rgba(216,171,82,.09),rgba(216,171,82,.02)); }
  .merit-card-top{ display:flex; align-items:flex-end; justify-content:space-between; }
  .stat-label{ font-size:9.5px; letter-spacing:.28em; color:rgba(233,213,177,.45); }
  .stat-num{ margin-top:6px; font-size:38px; font-weight:600; color:var(--gold-bright); line-height:1; }
  .stat-num .unit{ font-size:14px; font-weight:400; margin-left:6px; color:rgba(233,213,177,.5); }
  .bars{ margin-top:22px; display:grid; grid-template-columns:repeat(7,1fr); gap:8px; align-items:end; height:76px; }
  .bar{ border-radius:2px; background:linear-gradient(180deg,#d8ab52,rgba(216,171,82,.25)); min-height:6%; }
  .bar.today{ background:linear-gradient(180deg,#f2d38a,#c69a4c); }
  .bar-labels{ margin-top:8px; display:grid; grid-template-columns:repeat(7,1fr); gap:8px; font-size:9px; color:rgba(233,213,177,.35); text-align:center; }
  .sec-label{ margin-top:26px; font-size:9.5px; letter-spacing:.3em; color:rgba(233,213,177,.4); }
  .sessions{ margin-top:12px; display:flex; flex-direction:column; gap:1px; }
  .session-row{ display:flex; align-items:center; justify-content:space-between; padding:15px 2px; border-bottom:1px solid rgba(216,171,82,.14); }
  .session-row .name{ font-size:14px; color:var(--ink); }
  .session-row .meta{ font-size:10px; color:rgba(233,213,177,.4); letter-spacing:.1em; margin-top:4px; }
  .session-row .val{ font-size:15px; color:var(--gold-bright); font-variant-numeric:tabular-nums; }

  /* --- wish --- */
  .wish-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; padding:0 4px; }
  .wish-hang{ display:flex; flex-direction:column; align-items:center; transform-origin:top center; animation:omSway 5s ease-in-out infinite; }
  .wish-cord{ width:1px; height:14px; background:rgba(233,213,177,.35); }
  .wish-plaque{ position:relative; width:100%; padding:14px 6px 16px; text-align:center; cursor:pointer; clip-path:polygon(50% 0,100% 14%,100% 100%,0 100%,0 14%); background:linear-gradient(180deg,#c08d52,#8a5c2e 55%,#6d4520); box-shadow:0 8px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,235,200,.22); border:none; }
  .wish-plaque .zh{ font-size:13px; line-height:1.2; color:#3a2211; letter-spacing:.14em; writing-mode:vertical-rl; white-space:nowrap; margin:0 auto; height:88px; display:flex; align-items:center; justify-content:center; }
  .wish-plaque .meta{ margin-top:7px; font-size:10px; letter-spacing:.1em; color:#f3e2c4; text-shadow:0 1px 2px rgba(0,0,0,.5); }
  .lamp-dot{ position:absolute; top:8px; right:8px; width:6px; height:6px; border-radius:50%; }
  .wish-progress-track{ margin-top:6px; height:3px; border-radius:3px; background:rgba(58,34,17,.25); overflow:hidden; }
  .wish-progress-fill{ height:100%; border-radius:3px; }
  .wish-progress-text{ margin-top:5px; font-size:8.5px; letter-spacing:.1em; color:rgba(58,34,17,.6); font-variant-numeric:tabular-nums; }
  .wish-active-mark{ position:absolute; top:8px; left:8px; font-size:8.5px; letter-spacing:.1em; color:rgba(58,34,17,.7); }
  .add-wish{ margin-top:30px; padding:14px 0; text-align:center; border:1px dashed rgba(216,171,82,.4); border-radius:6px; font-size:12px; letter-spacing:.24em; color:var(--gold); cursor:pointer; background:none; width:100%; }
  .wish-hint{ margin:14px 0 0; text-align:center; font-size:10px; letter-spacing:.12em; color:rgba(233,213,177,.3); }

  .editor-overlay{ position:fixed; inset:0; z-index:40; background:rgba(12,4,5,.72); backdrop-filter:blur(3px); display:flex; align-items:flex-end; justify-content:center; }
  .editor-sheet{ width:100%; max-width:480px; padding:26px 26px 40px; box-sizing:border-box; background:linear-gradient(180deg,#efe4c8,#ddcda8); box-shadow:0 -22px 44px rgba(0,0,0,.55); animation:omUnfurl .34s ease-out forwards; }
  .field-label{ margin-top:18px; font-size:9.5px; letter-spacing:.28em; color:rgba(74,52,24,.5); }
  .field-label:first-of-type{ margin-top:18px; }
  .field-input{ margin-top:8px; width:100%; box-sizing:border-box; padding:11px 12px; font-family:'Noto Serif SC',serif; font-size:19px; letter-spacing:.16em; color:#3a2a18; background:rgba(255,255,255,.5); border:1px solid rgba(74,52,24,.3); border-radius:3px; outline:none; }
  .field-input.small{ font-size:13px; letter-spacing:.1em; padding:9px 12px; }
  .editor-actions{ margin-top:22px; display:flex; gap:10px; }
  .btn-save{ flex:1; padding:13px 0; text-align:center; border-radius:4px; background:linear-gradient(180deg,#8e1f1a,#6d1512); color:#f6e2c8; font-size:13px; letter-spacing:.24em; cursor:pointer; border:none; }
  .btn-del{ padding:13px 20px; text-align:center; border-radius:4px; border:1px solid rgba(74,52,24,.35); color:rgba(74,52,24,.75); font-size:13px; letter-spacing:.2em; cursor:pointer; background:none; }

  /* --- install prompt --- */
  .install-overlay{ position:fixed; inset:0; z-index:50; background:rgba(12,4,5,.72); backdrop-filter:blur(3px); display:flex; align-items:flex-end; justify-content:center; }
  .install-sheet{ width:100%; max-width:480px; padding:26px 26px 40px; box-sizing:border-box; background:linear-gradient(180deg,#efe4c8,#ddcda8); box-shadow:0 -22px 44px rgba(0,0,0,.55); animation:omUnfurl .34s ease-out forwards; text-align:center; }
  .install-icon{ width:56px; height:56px; border-radius:14px; box-shadow:0 8px 18px rgba(0,0,0,.3); }
  .install-title{ margin-top:14px; font-size:16px; color:#4a3418; letter-spacing:.1em; }
  .install-body{ margin-top:8px; font-size:12px; line-height:1.8; color:rgba(74,52,24,.65); }
  .install-steps{ margin-top:16px; display:flex; flex-direction:column; gap:10px; text-align:left; }
  .install-step{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:rgba(74,52,24,.8); }
  .install-step .num{ flex:none; width:22px; height:22px; border-radius:50%; background:rgba(142,31,26,.12); color:#8e1f1a; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; }
  .install-actions{ margin-top:20px; display:flex; gap:10px; }
  .install-btn-primary{ flex:1; padding:13px 0; text-align:center; border-radius:4px; background:linear-gradient(180deg,#8e1f1a,#6d1512); color:#f6e2c8; font-size:13px; letter-spacing:.24em; cursor:pointer; border:none; }
  .install-btn-secondary{ flex:1; padding:13px 0; text-align:center; border-radius:4px; border:1px solid rgba(74,52,24,.35); color:rgba(74,52,24,.75); font-size:13px; letter-spacing:.2em; cursor:pointer; background:none; }

  /* --- me / settings --- */

    .floater, .ripple, .seal, .sheet, .editor-sheet, .live-dot, .plaque-hang, .wish-hang{ animation:none !important; }
  }

<body>
<div id="stage">
  <div id="app"></div>
  <nav id="nav"></nav>
</div>
<div id="modalRoot"></div>
<div id="installRoot"></div>

<script>
(function(){
  'use strict';

  var KEY = 'woodenfish.v1';
  var OLD_STATE_KEY = 'mokugyo-state';
  var OLD_REMINDER_KEY = 'mokugyo-reminder';

  function pad2(n){ return String(n).padStart(2,'0'); }
  function fmt(n){ return (n||0).toLocaleString('en-US'); }
  function todayStr(d){ d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function dateFromStr(s){ return new Date(s + 'T00:00:00'); }
  function addDays(s, n){ var d = dateFromStr(s); d.setDate(d.getDate()+n); return todayStr(d); }
  function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
  function hhmm(mins){ return pad2(Math.floor(mins/60)%24) + ':' + pad2(((mins%60)+60)%60); }
  function slotLabel(mins){
    var h = Math.floor(mins/60) % 24;
    if(h < 11) return '晨课';
    if(h < 16) return '午课';
    return '晚课';
  }
  function nextUnlit(wishes, from){
    for(var k=1;k<=wishes.length;k++){
      var j = (from + k) % wishes.length;
      if(!wishes[j].lit) return j;
    }
    return null;
  }
  function hallWidth(name){
    var len = (name || '木 魚 堂').length;
    return Math.max(70, Math.min(230, len*13 + 16)) + 'px';
  }

  var NAMES = [
    ['慧','慧明','杭州'], ['林','林安','台北'], ['一','一尘','成都'],
    ['周','周小满','上海'], ['净','净远','京都'], ['A','Ana','Lisbon'],
    ['陈','陈树','广州'], ['妙','妙音','苏州'], ['J','Jonas','Berlin'],
    ['王','王一舟','北京']
  ];

  var BURN_SECS = 1800;
  var GOAL = 99;

  var state = {
    tab: 'altar',
    day: todayStr(),
    today: 0, total: 0,
    merits: { morning: 0, night: 0 },
    history: {},
    hallName: '木 魚 堂',
    wishes: [
      { text:'身体康健', meta:'母亲', lit:false, p:41 },
      { text:'事事顺遂', meta:'自己', lit:true, p:99 },
      { text:'考试上榜', meta:'弟弟', lit:false, p:12 },
      { text:'心安无忧', meta:'自己', lit:false, p:0 },
      { text:'家宅平安', meta:'全家', lit:true, p:99 },
      { text:'故人安息', meta:'外公', lit:false, p:68 }
    ],
    active: 0,
    reminders: [ { m: 6*60, on: true, label: '晨课' }, { m: 21*60, on: true, label: '晚课' } ],
    reminderOn: true, remindersNotifiedDay: '', remindersNotifiedIdx: [],
    sound: true, haptic: true,
    burnEnd: null, burnStartMerit: 0, burnDone: false, sessionMerit: 0, confirmSnuff: false,
    sealed: false, scrollOpen: false, confirmReset: false,
    floaters: [], ripples: [], seq: 0,
    editing: null, celebrate: null,
    sanghaMerit: 3912460, sanghaPeople: 4281, tickerTick: 0,
    installOpen: false, installMode: null
  };

  var hydrated = false;

  function session(){ return new Date().getHours() < 15 ? 'morning' : 'night'; }

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var d = JSON.parse(raw);
        Object.assign(state, {
          day: d.day || todayStr(),
          today: d.today || 0,
          total: d.total || 0,
          merits: d.merits || { morning:0, night:0 },
          history: d.history || {},
          hallName: d.hallName || state.hallName,
          wishes: ((Array.isArray(d.wishes) && d.wishes.length) ? d.wishes : state.wishes).map(function(w){
            return { text: w.text, meta: w.meta, lit: !!w.lit, p: w.lit ? GOAL : (w.p != null ? w.p : 0) };
          }),
          active: (typeof d.active === 'number' || d.active === null) ? d.active : state.active,
          reminders: (Array.isArray(d.reminders) && d.reminders.length) ? d.reminders
            : (typeof d.minutes === 'number')
              ? [{ m: d.minutes, on: (typeof d.reminderOn === 'boolean' ? d.reminderOn : true), label: slotLabel(d.minutes) }]
              : state.reminders,
          reminderOn: (typeof d.reminderOn === 'boolean') ? d.reminderOn : true,
          remindersNotifiedDay: d.remindersNotifiedDay || '',
          remindersNotifiedIdx: Array.isArray(d.remindersNotifiedIdx) ? d.remindersNotifiedIdx : [],
          sound: (typeof d.sound === 'boolean') ? d.sound : true,
          haptic: (typeof d.haptic === 'boolean') ? d.haptic : true,
          burnEnd: (d.burnEnd && d.burnEnd > Date.now()) ? d.burnEnd : null,
          burnStartMerit: d.burnStartMerit || 0,
          burnDone: !!(d.burnEnd && d.burnEnd <= Date.now() && d.day === todayStr()),
          sessionMerit: (d.burnEnd && d.burnEnd <= Date.now() && d.day === todayStr())
            ? Math.max(0, (d.today || 0) - (d.burnStartMerit || 0)) : 0
        });
      } else {
        migrateOld();
      }
    }catch(e){ /* first run or blocked storage */ }

    hydrated = true;
    try{
      var sharedHall = new URL(location.href).searchParams.get('hall');
      if(sharedHall && !raw){
        state.hallName = sharedHall.slice(0, 14);
        save();
      }
      if(sharedHall){
        var cleanUrl = new URL(location.href);
        cleanUrl.searchParams.delete('hall');
        history.replaceState(null, '', cleanUrl.pathname + cleanUrl.search + cleanUrl.hash);
      }
    }catch(e){ /* URL API unavailable or blocked */ }

    var a = state.active;
    if(a === null || !state.wishes[a] || state.wishes[a].lit){
      var firstUnlit = -1;
      for(var k=0;k<state.wishes.length;k++){ if(!state.wishes[k].lit){ firstUnlit = k; break; } }
      state.active = firstUnlit === -1 ? null : firstUnlit;
    }

    rollDayIfNeeded();
    if(state.burnEnd) runBurn();
  }

  function migrateOld(){
    try{
      var rawState = localStorage.getItem(OLD_STATE_KEY);
      if(rawState){
        var od = JSON.parse(rawState);
        state.total = od.total || 0;
        if(od.day === todayStr()){
          state.today = od.todayCount || 0;
          state.merits[session()] = state.today;
        }
      }
      var rawRem = localStorage.getItem(OLD_REMINDER_KEY);
      if(rawRem){
        var rd = JSON.parse(rawRem);
        var enabled = (typeof rd.enabled === 'boolean') ? rd.enabled : true;
        var mins = state.reminders[0] ? state.reminders[0].m : 6*60;
        if(rd.time){
          var parts = rd.time.split(':').map(Number);
          mins = (parts[0]||0)*60 + (parts[1]||0);
        }
        state.reminderOn = enabled;
        state.reminders = [{ m: mins, on: true, label: slotLabel(mins) }];
        if(rd.lastNotified){ state.remindersNotifiedDay = rd.lastNotified; state.remindersNotifiedIdx = [0]; }
      }
    }catch(e){ /* nothing to migrate */ }
  }

  function rollDayIfNeeded(){
    var t = todayStr();
    if(state.day !== t){
      if(state.today > 0) state.history[state.day] = state.today;
      state.day = t;
      state.today = 0;
      state.merits = { morning:0, night:0 };
      state.burnEnd = null; state.burnDone = false; state.sessionMerit = 0;
    }
  }

  function save(){
    if(!hydrated) return;
    try{
      localStorage.setItem(KEY, JSON.stringify({
        day: state.day, today: state.today, total: state.total,
        merits: state.merits, history: state.history, wishes: state.wishes,
        hallName: state.hallName, active: state.active,
        reminders: state.reminders, reminderOn: state.reminderOn,
        remindersNotifiedDay: state.remindersNotifiedDay, remindersNotifiedIdx: state.remindersNotifiedIdx,
        sound: state.sound, haptic: state.haptic,
        burnEnd: state.burnEnd, burnStartMerit: state.burnStartMerit
      }));
    }catch(e){ /* storage unavailable */ }
  }

  function streak(){
    var cursor = dateFromStr(state.day);
    var histToday = state.history[state.day] || state.today;
    if(!(histToday > 0)) cursor.setDate(cursor.getDate()-1);
    var count = 0;
    while(true){
      var key = todayStr(cursor);
      var v = (key === state.day) ? (state.history[state.day] || state.today) : state.history[key];
      if(!(v > 0)) break;
      count++;
      cursor.setDate(cursor.getDate()-1);
    }
    return count;
  }

  function weekBars(){
    var d = dateFromStr(state.day);
    var dow = (d.getDay() + 6) % 7; // Mon=0
    var monday = addDays(state.day, -dow);
    var days = [];
    for(var i=0;i<7;i++){
      var key = addDays(monday, i);
      var v = (key === state.day) ? (state.merits.morning + state.merits.night) : (state.history[key] || 0);
      days.push({ key: key, val: v, isToday: key === state.day });
    }
    var max = Math.max.apply(null, days.map(function(x){ return x.val; }).concat([1]));
    days.forEach(function(x){ x.pct = Math.max(6, Math.round((x.val / max) * 100)); });
    return days;
  }

  /* ---------- fish tap ---------- */

  var audioCtx;
  function knock(){
    if(!state.sound) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var now = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(90, now + 0.12);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.5, now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.24);
    }catch(e){ /* audio not available */ }
  }

  var celebTimer = null;

  function tapFish(){
    var id = ++state.seq;
    var i = state.active;
    var w = (i !== null && state.wishes[i]) ? state.wishes[i] : null;
    if(w){
      var p = Math.min(GOAL, (w.p || 0) + 1);
      var justLit = (p >= GOAL && !w.lit);
      state.wishes = state.wishes.map(function(x, j){
        return j === i ? { text:x.text, meta:x.meta, p:p, lit: x.lit || p >= GOAL } : x;
      });
      if(justLit){
        state.celebrate = w.text;
        clearTimeout(celebTimer);
        celebTimer = setTimeout(function(){ state.celebrate = null; renderAltarLive(); }, 2400);
        state.active = nextUnlit(state.wishes, i);
      }
    }
    state.today += 1; state.total += 1;
    var s = session();
    state.merits[s] = (state.merits[s] || 0) + 1;
    state.floaters.push({ id: id, left: (34 + Math.random()*120).toFixed(0) + 'px' });
    if(state.floaters.length > 6) state.floaters.shift();
    state.ripples.push({ id: id });
    if(state.ripples.length > 4) state.ripples.shift();
    knock();
    if(state.haptic && navigator.vibrate) navigator.vibrate(10);
    save();
    renderAltarLive();
    setTimeout(function(){
      state.floaters = state.floaters.filter(function(f){ return f.id !== id; });
      state.ripples = state.ripples.filter(function(r){ return r.id !== id; });
      renderAltarLive();
    }, 1200);
  }

  /* ---------- incense ---------- */

  var burnTimer = null, snuffTimer = null;

  function runBurn(){
    clearInterval(burnTimer);
    burnTimer = setInterval(function(){
      if(!state.burnEnd) return;
      if(state.burnEnd > Date.now()){ updateIncenseDom(); return; }
      clearInterval(burnTimer);
      state.burnEnd = null; state.burnDone = true;
      state.sessionMerit = state.today - state.burnStartMerit;
      save();
      renderAltarLive();
    }, 500);
  }

  function toggleBurn(){
    if(state.burnEnd){
      if(!state.confirmSnuff){
        state.confirmSnuff = true;
        clearTimeout(snuffTimer);
        snuffTimer = setTimeout(function(){ state.confirmSnuff = false; renderAltarLive(); }, 3000);
        renderAltarLive();
        return;
      }
      clearTimeout(snuffTimer); clearInterval(burnTimer);
      state.burnEnd = null; state.burnDone = false; state.confirmSnuff = false;
      save(); renderAltarLive();
      return;
    }
    state.burnEnd = Date.now() + BURN_SECS*1000;
    state.burnStartMerit = state.today;
    state.burnDone = false;
    save(); runBurn(); renderAltarLive();
  }

  function dismissBurn(){
    state.burnDone = false; state.burnEnd = null; state.burnStartMerit = 0;
    save(); renderAltarLive();
  }

  function burnFrac(){
    if(!state.burnEnd) return 0;
    var left = Math.max(0, state.burnEnd - Date.now());
    return left / (BURN_SECS*1000);
  }

  function updateIncenseDom(){
    var frac = burnFrac();
    var left = Math.max(0, Math.round((state.burnEnd - Date.now())/1000));
    var stick = document.getElementById('incenseStick');
    var ember = document.getElementById('incenseEmber');
    var smokes = document.querySelectorAll('.incense-smoke');
    var label = document.getElementById('incenseLabel');
    if(stick) stick.style.height = (12 + 56*frac) + 'px';
    var emberBottom = (28 + 12 + 56*frac) + 'px';
    var smokeBottom = (34 + 12 + 56*frac) + 'px';
    if(ember) ember.style.bottom = emberBottom;
    smokes.forEach(function(s){ s.style.bottom = smokeBottom; });
    if(label && !state.confirmSnuff){
      label.textContent = Math.floor(left/60) + ':' + pad2(left%60);
      label.style.color = 'var(--gold-bright)';
    }
  }

  /* ---------- reminder / notifications ---------- */

  function reminderTimesText(){
    var enabled = state.reminderOn ? state.reminders.filter(function(r){ return r.on; }) : [];
    if(!enabled.length) return '无';
    return enabled.slice().sort(function(a,b){ return a.m - b.m; }).map(function(r){ return hhmm(r.m); }).join(' · ');
  }

  function reminderStateText(){
    var n = state.reminderOn ? state.reminders.filter(function(r){ return r.on; }).length : 0;
    return n ? ('每日 ' + n + ' 次') : '已关闭';
  }

  async function fireReminderNotification(label){
    var title = '木魚堂 · 敲木鱼时间到了';
    var options = {
      body: (label ? label + ' · ' : '') + '今天还没敲木鱼，来累积一点功德吧 🐟',
      icon: 'mokugyo-icon-192.png',
      badge: 'mokugyo-icon-192.png',
      tag: 'mokugyo-daily-reminder'
    };
    try{
      if('serviceWorker' in navigator){
        var reg = await navigator.serviceWorker.ready;
        await reg.showNotification(title, options);
      } else if('Notification' in window){
        new Notification(title, options);
      }
    }catch(e){ /* notification not available */ }
  }

  function checkReminder(){
    if(!state.reminderOn) return;
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    var now = new Date();
    var t = todayStr();
    if(state.remindersNotifiedDay !== t){ state.remindersNotifiedDay = t; state.remindersNotifiedIdx = []; }
    var fired = false;
    state.reminders.forEach(function(r, i){
      if(!r.on) return;
      if(state.remindersNotifiedIdx.indexOf(i) !== -1) return;
      var h = Math.floor(r.m/60)%24, m = r.m%60;
      if(now.getHours() > h || (now.getHours() === h && now.getMinutes() >= m)){
        fireReminderNotification(r.label);
        state.remindersNotifiedIdx.push(i);
        fired = true;
      }
    });
    if(fired) save();
  }

  async function registerPeriodicSync(){
    try{
      if(!('serviceWorker' in navigator)) return;
      var reg = await navigator.serviceWorker.ready;
      if(!('periodicSync' in reg)) return;
      var status = await navigator.permissions.query({ name:'periodic-background-sync' });
      if(status.state === 'granted'){
        await reg.periodicSync.register('mokugyo-daily-reminder', { minInterval: 20*60*60*1000 });
      }
    }catch(e){ /* unavailable, in-app check still covers it */ }
  }

  async function toggleReminder(){
    if(!state.reminderOn){
      if('Notification' in window && Notification.permission !== 'granted'){
        var perm = await Notification.requestPermission();
        if(perm !== 'granted'){ save(); render(); return; }
      }
      state.reminderOn = true;
      registerPeriodicSync();
    } else {
      state.reminderOn = false;
    }
    save(); render();
  }

  /* ---------- wish CRUD ---------- */

  function openWishEditor(i){
    state.editing = (i === undefined) ? 'new' : i;
    renderModal();
  }
  function closeEditor(){ state.editing = null; renderModal(); }
  function saveWish(){
    var textEl = document.getElementById('wishTextInput');
    var metaEl = document.getElementById('wishMetaInput');
    var activeEl = document.getElementById('wishActiveCheck');
    var isNew = state.editing === 'new';
    var prev = isNew ? null : state.wishes[state.editing];
    var w = {
      text: (textEl.value || '心想事成').slice(0,6),
      meta: metaEl.value || '自己',
      p: prev ? (prev.p || 0) : 0,
      lit: prev ? prev.lit : false
    };
    var wishes = isNew ? state.wishes.concat([w]) : state.wishes.map(function(x,j){ return j === state.editing ? w : x; });
    var idx = isNew ? wishes.length - 1 : state.editing;
    var draftActive = activeEl.getAttribute('data-active') === '1';
    var active = draftActive ? idx : (state.active === idx ? null : state.active);
    state.wishes = wishes;
    state.active = active;
    state.editing = null;
    save(); renderModal(); render();
  }
  function deleteWish(){
    if(typeof state.editing !== 'number') return;
    var i = state.editing;
    state.active = (state.active === i) ? null : (state.active > i ? state.active - 1 : state.active);
    state.wishes = state.wishes.filter(function(_,j){ return j !== i; });
    state.editing = null;
    save(); renderModal(); render();
  }
  function toggleDraftActive(){
    var el = document.getElementById('wishActiveCheck');
    var on = el.getAttribute('data-active') === '1';
    el.setAttribute('data-active', on ? '0' : '1');
    el.textContent = on ? '' : '✓';
  }

  /* ---------- share / reset ---------- */

  function stampShare(){
    state.sealed = true; renderAltarLive();
    var hallTitle = (state.hallName || '木魚堂').replace(/\s+/g, '');
    var shareUrl = location.href;
    try{
      var u = new URL(location.href);
      u.searchParams.set('hall', hallTitle);
      shareUrl = u.toString();
    }catch(e){ /* URL API unavailable */ }
    var shareData = {
      title: hallTitle,
      text: hallTitle + ' · 我已经敲了 ' + fmt(state.today) + ' 次木鱼，累计 ' + fmt(state.total) + ' 功德，一起来修行吧 🐟',
      url: shareUrl
    };
    (async function(){
      try{
        if(navigator.share) await navigator.share(shareData);
        else if(navigator.clipboard) await navigator.clipboard.writeText(shareData.url);
      }catch(e){ /* cancelled or unavailable */ }
    })();
    setTimeout(function(){ state.sealed = false; renderAltarLive(); }, 2600);
  }

  function resetToday(){
    state.today = 0; state.merits = { morning:0, night:0 };
    save(); renderAltarLive();
  }

  var resetTimer = null;

  function resetTotal(){
    if(!state.confirmReset){
      state.confirmReset = true;
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function(){ state.confirmReset = false; render(); }, 3000);
      render();
      return;
    }
    clearTimeout(resetTimer);
    state.total = 0; state.today = 0; state.merits = { morning:0, night:0 }; state.confirmReset = false;
    save(); render();
  }

  function toggleScroll(){ state.scrollOpen = !state.scrollOpen; renderAltarLive(); }

  /* ---------- sangha ticker ---------- */

  function sanghaTickerData(){
    var tick = state.tickerTick;
    var out = [];
    for(var i=0;i<6;i++){
      var n = NAMES[(tick + i*3) % NAMES.length];
      var secs = i === 0 ? 0 : i*11 + ((tick*7 + i*13) % 9);
      out.push({
        initial: n[0], name: n[1], place: n[2],
        ago: secs < 5 ? '刚刚' : secs + ' 秒前',
        merit: 12 + ((tick*17 + i*29) % 180)
      });
    }
    return out;
  }

  var sanghaTimer = setInterval(function(){
    state.sanghaMerit += Math.floor(3 + Math.random()*24);
    state.sanghaPeople = Math.max(3900, state.sanghaPeople + Math.floor(Math.random()*7) - 3);
    state.tickerTick += 1;
    if(state.tab === 'sangha') render();
  }, 1800);

  /* ---------- install prompt ---------- */

  var INSTALL_DISMISS_KEY = 'woodenfish.installDismissed';
  var deferredInstallPrompt = null;

  function isStandalone(){
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  }
  function isIOS(){
    return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  }
  function installDismissed(){
    try{ return localStorage.getItem(INSTALL_DISMISS_KEY) === '1'; }catch(e){ return false; }
  }
  function markInstallDismissed(){
    try{ localStorage.setItem(INSTALL_DISMISS_KEY, '1'); }catch(e){ /* storage unavailable */ }
  }

  function openInstallPrompt(){
    state.installOpen = true;
    state.installMode = (deferredInstallPrompt && !isIOS()) ? 'android' : 'ios';
    renderInstallModal();
  }

  function closeInstallPrompt(remember){
    state.installOpen = false;
    if(remember) markInstallDismissed();
    renderInstallModal();
  }

  function doInstall(){
    if(!deferredInstallPrompt){ closeInstallPrompt(true); return; }
    var evt = deferredInstallPrompt;
    deferredInstallPrompt = null;
    state.installOpen = false;
    renderInstallModal();
    evt.prompt();
    evt.userChoice.then(function(){ markInstallDismissed(); }).catch(function(){ /* dismissed */ });
  }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    if(!isStandalone() && !installDismissed()){
      state.installOpen = true;
      state.installMode = 'android';
      renderInstallModal();
    }
  });

  window.addEventListener('appinstalled', function(){
    deferredInstallPrompt = null;
    state.installOpen = false;
    markInstallDismissed();
    renderInstallModal();
  });

  function renderInstallModal(){
    var root = document.getElementById('installRoot');
    if(!state.installOpen){ root.innerHTML = ''; return; }
    var isIosMode = state.installMode === 'ios';
    var stepsHtml = isIosMode ? (
      '<div class="install-steps">' +
        '<div class="install-step"><span class="num">1</span>点击底部分享按钮 ⬆️</div>' +
        '<div class="install-step"><span class="num">2</span>选择「添加到主屏幕」</div>' +
        '<div class="install-step"><span class="num">3</span>点击「添加」即可</div>' +
      '</div>'
    ) : '';
    var actionsHtml = isIosMode ? (
      '<div class="install-actions">' +
        '<button class="install-btn-primary" data-action="closeInstall" data-remember="1">知 道 了</button>' +
      '</div>'
    ) : (
      '<div class="install-actions">' +
        '<button class="install-btn-secondary" data-action="closeInstall" data-remember="1">以后再说</button>' +
        '<button class="install-btn-primary" data-action="doInstall">安 装</button>' +
      '</div>'
    );
    root.innerHTML =
      '<div class="install-overlay" data-action="overlayCloseInstall">' +
        '<div class="install-sheet">' +
          '<img class="install-icon" src="mokugyo-icon-192.png" alt="">' +
          '<div class="install-title">把木魚堂装到主屏幕</div>' +
          '<div class="install-body">全屏敲木鱼，离线也能用，还能收到每日提醒。</div>' +
          stepsHtml +
          actionsHtml +
        '</div>' +
      '</div>';
  }

  /* ---------- render: altar ---------- */

  function renderAltar(){
    var frac = burnFrac();
    var left = state.burnEnd ? Math.max(0, Math.round((state.burnEnd - Date.now())/1000)) : 0;
    var stickHeight = state.burnEnd ? (12 + 56*frac) : (state.burnDone ? 12 : 68);
    var burnLabel = state.confirmSnuff ? '再点熄香'
      : state.burnEnd ? (Math.floor(left/60) + ':' + pad2(left%60))
      : '点香 30 分';
    var burnColor = state.confirmSnuff ? '#e6883c' : state.burnEnd ? 'var(--gold-bright)' : 'rgba(233,213,177,.38)';
    var dayTotal = state.merits.morning + state.merits.night;

    var floatersHtml = state.floaters.map(function(f){
      return '<div class="floater" style="left:' + f.left + '">功德 +1</div>';
    }).join('');
    var ripplesHtml = state.ripples.map(function(){ return '<div class="ripple"></div>'; }).join('');

    var smokeHtml = '';
    if(state.burnEnd){
      var sb = (34 + 12 + 56*frac) + 'px';
      smokeHtml =
        '<div class="incense-smoke" style="bottom:' + sb + ';left:30px;animation-delay:0s"></div>' +
        '<div class="incense-smoke" style="bottom:' + sb + ';left:29px;width:11px;height:11px;animation-delay:1.7s"></div>' +
        '<div class="incense-smoke" style="bottom:' + sb + ';left:30px;width:8px;height:8px;animation-delay:3.4s"></div>';
    }
    var emberHtml = state.burnEnd
      ? '<div class="incense-ember" id="incenseEmber" style="bottom:' + (28 + 12 + 56*frac) + 'px"></div>' + smokeHtml
      : '';

    var burnToastHtml = state.burnDone ? (
      '<div class="burn-toast">' +
        '<div><div class="t1">一炷香已尽</div><div class="t2">此座 ' + fmt(state.sessionMerit) + ' 功德 · 30 分钟</div></div>' +
        '<button data-action="dismissBurn">收</button>' +
      '</div>'
    ) : '';

    var sheetHtml = state.scrollOpen ? renderReminderSheet() : '';

    var activeWish = (state.active !== null && state.wishes[state.active]) ? state.wishes[state.active] : null;
    var activeText = activeWish
      ? (activeWish.lit ? activeWish.text + ' · 已点灯，另择一願' : activeWish.text)
      : '未择心願 · 去祈願牆';
    var activeInk = (activeWish && !activeWish.lit) ? 'var(--gold-bright)' : 'rgba(233,213,177,.45)';
    var activeProgress = activeWish
      ? (activeWish.lit ? '已满' : Math.min(GOAL, activeWish.p||0) + ' / ' + GOAL)
      : '—';
    var activeBar = activeWish ? Math.round(Math.min(GOAL, activeWish.p||0)/GOAL*100) + '%' : '0%';

    var celebrateHtml = state.celebrate ? (
      '<div class="celebrate-overlay">' +
        '<div class="celebrate-flare"></div>' +
        '<div class="celebrate-card">' +
          '<div class="celebrate-dot"></div>' +
          '<div class="celebrate-text">' + state.celebrate + '</div>' +
          '<div class="celebrate-sub">灯 已 点 亮 · 九 十 九 功 德</div>' +
        '</div>' +
      '</div>'
    ) : '';

    return (
      '<div class="hdr-rule"><div class="line"></div>' +
        '<input id="hallNameInput" class="hall-input" maxlength="14" placeholder="木 魚 堂" value="' + escapeAttr(state.hallName) + '" style="width:' + hallWidth(state.hallName) + '">' +
      '<div class="line r"></div></div>' +
      '<div class="today-wrap">' +
        '<div class="today-label">今日功德 · TODAY\'S MERIT</div>' +
        '<div class="today-num">' + fmt(dayTotal) + '</div>' +
        '<div class="total-line">累计 ' + fmt(state.total) + '</div>' +
      '</div>' +
      '<div class="fish-area">' +
        floatersHtml +
        '<button class="fish-btn" data-action="tapFish">' +
          ripplesHtml +
          '<div class="fish-glow"></div>' +
          '<div class="fish-body"><div class="fish-mouth"></div><div class="fish-shine"></div></div>' +
        '</button>' +
        '<div class="tap-hint">TAP THE FISH · 敲 木 魚</div>' +
        '<button class="active-card" data-action="goTab" data-tab="wish">' +
          '<div class="active-card-top"><span class="lbl">所 向</span><span class="frac">' + activeProgress + '</span></div>' +
          '<div class="active-text" style="color:' + activeInk + '">' + activeText + '</div>' +
          '<div class="active-track"><div class="active-fill" style="width:' + activeBar + '"></div></div>' +
        '</button>' +
        celebrateHtml +
        '<button class="incense" data-action="toggleBurn">' +
          '<div class="incense-stick" id="incenseStick" style="height:' + stickHeight + 'px"></div>' +
          emberHtml +
          '<div class="incense-holder"></div>' +
          '<div class="incense-label" id="incenseLabel" style="color:' + burnColor + '">' + burnLabel + '</div>' +
        '</button>' +
        burnToastHtml +
      '</div>' +
      '<div class="beam-wrap">' +
        '<div class="beam"></div>' +
        '<div class="plaques">' +
          '<div class="plaque-hang p1"><div class="cord"></div>' +
            '<button class="plaque" data-action="resetToday"><div class="zh">重置</div><div class="en">RESET</div></button>' +
          '</div>' +
          '<div class="plaque-hang p2"><div class="cord"></div>' +
            '<button class="plaque" data-action="stampShare"><div class="zh">分享</div><div class="en">SHARE</div>' +
              (state.sealed ? '<div class="seal"><span>分享</span></div>' : '') +
            '</button>' +
          '</div>' +
          '<div class="plaque-hang p3"><div class="cord"></div>' +
            '<button class="plaque" data-action="toggleScroll"><div class="zh">提醒</div><div class="en">REMIND</div></button>' +
          '</div>' +
        '</div>' +
        sheetHtml +
      '</div>'
    );
  }

  function renderReminderSheet(){
    var rowsHtml = state.reminders.map(function(r, i){
      var on = r.on && state.reminderOn;
      var mark = on ? '✓' : '';
      var ink = on ? '#3a2a18' : 'rgba(58,42,24,.35)';
      return (
        '<div class="reminder-row">' +
          '<button class="reminder-toggle" data-action="toggleReminderRow" data-idx="' + i + '">' +
            '<span class="check-box" style="color:' + ink + '">' + mark + '</span>' +
            '<span class="reminder-time-big" style="color:' + ink + '">' + hhmm(r.m) + '</span>' +
          '</button>' +
          '<input class="reminder-label-input" data-idx="' + i + '" maxlength="8" placeholder="提醒事由" value="' + escapeAttr(r.label||'') + '">' +
          '<button class="reminder-adj" data-action="shiftReminder" data-idx="' + i + '" data-delta="-15">−</button>' +
          '<button class="reminder-adj" data-action="shiftReminder" data-idx="' + i + '" data-delta="15">+</button>' +
          '<button class="reminder-remove" data-action="removeReminder" data-idx="' + i + '">取下</button>' +
        '</div>'
      );
    }).join('');
    return (
      '<div class="sheet">' +
        '<div class="sheet-head"><div class="sheet-title">每日提醒</div><button class="sheet-close" data-action="toggleScroll">收起</button></div>' +
        '<div class="reminder-list">' + rowsHtml + '</div>' +
        '<button class="add-reminder-btn" data-action="addReminder">加 一 次 提 醒</button>' +
        '<div class="sheet-rule"></div>' +
        '<div class="sheet-note">提醒将以静默通知送达 · ' + reminderStateText() + '</div>' +
      '</div>'
    );
  }

  function renderAltarLive(){
    if(state.tab !== 'altar') return;
    document.getElementById('app').innerHTML = renderAltar();
    bindAltarInputs();
  }

  /* ---------- render: merit ---------- */

  function renderMerit(){
    var bars = weekBars();
    var wd = ['一','二','三','四','五','六','日'];
    var barsHtml = bars.map(function(b){
      return '<div class="bar' + (b.isToday?' today':'') + '" style="height:' + b.pct + '%"></div>';
    }).join('');
    var labelsHtml = wd.map(function(w){ return '<div>' + w + '</div>'; }).join('');
    return (
      '<div class="page-title">功 德 簿</div>' +
      '<div class="scroll-pad">' +
        '<div class="merit-card">' +
          '<div class="merit-card-top">' +
            '<div><div class="stat-label">连续</div><div class="stat-num">' + streak() + '<span class="unit">天</span></div></div>' +
            '<div style="text-align:right"><div class="stat-label">累计</div><div class="stat-num">' + fmt(state.total) + '</div></div>' +
          '</div>' +
          '<div class="bars">' + barsHtml + '</div>' +
          '<div class="bar-labels">' + labelsHtml + '</div>' +
        '</div>' +
        '<div class="sec-label">今日 · SESSIONS</div>' +
        '<div class="sessions">' +
          '<div class="session-row"><div><div class="name">晨课</div><div class="meta">06:00 · ' + fmt(state.merits.morning) + '</div></div><div class="val">+ ' + fmt(state.merits.morning) + '</div></div>' +
          '<div class="session-row"><div><div class="name">晚课</div><div class="meta">21:00 · ' + fmt(state.merits.night) + '</div></div><div class="val">+ ' + fmt(state.merits.night) + '</div></div>' +
          '<div class="session-row"><div><div class="name">今日合计</div><div class="meta">晨课 · 晚课</div></div><div class="val">+ ' + fmt(state.merits.morning + state.merits.night) + '</div></div>' +
        '</div>' +
      '</div>'
    );
  }

  /* ---------- render: wish ---------- */

  function renderWish(){
    var itemsHtml = state.wishes.map(function(w, i){
      var p = Math.min(GOAL, w.p || 0);
      var pct = Math.round(p/GOAL*100) + '%';
      var lampColor = w.lit ? '#e6883c' : 'rgba(58,34,17,.3)';
      var lampGlow = w.lit ? '0 0 8px 2px rgba(230,136,60,.5)' : 'none';
      var barInk = w.lit ? '#e6883c' : 'rgba(58,34,17,.55)';
      var progressText = w.lit ? '已点灯' : (p + ' / ' + GOAL);
      var activeMarkHtml = (state.active === i) ? '<div class="wish-active-mark">所向</div>' : '';
      return (
        '<div class="wish-hang"><div class="wish-cord"></div>' +
          '<button class="wish-plaque" data-action="editWish" data-idx="' + i + '">' +
            '<div class="zh">' + w.text + '</div>' +
            '<div class="meta">' + w.meta + '</div>' +
            '<div class="wish-progress-track"><div class="wish-progress-fill" style="width:' + pct + ';background:' + barInk + '"></div></div>' +
            '<div class="wish-progress-text">' + progressText + '</div>' +
            '<div class="lamp-dot" style="background:' + lampColor + ';box-shadow:' + lampGlow + '"></div>' +
            activeMarkHtml +
          '</button>' +
        '</div>'
      );
    }).join('');
    return (
      '<div class="page-title">祈 願 牆</div>' +
      '<div class="page-sub">敲够九九功德，可为一愿点灯</div>' +
      '<div class="scroll-pad" style="padding-top:24px">' +
        '<div class="beam"></div>' +
        '<div style="height:14px"></div>' +
        '<div class="wish-grid">' + itemsHtml + '</div>' +
        '<button class="add-wish" data-action="addWish">挂 上 新 願</button>' +
        '<div class="wish-hint">轻点木牌可编辑或取下</div>' +
      '</div>'
    );
  }

  function renderModal(){
    var root = document.getElementById('modalRoot');
    if(state.editing === null){ root.innerHTML = ''; return; }
    var isNew = state.editing === 'new';
    var w = isNew ? { text:'', meta:'' } : state.wishes[state.editing];
    var defaultActive = isNew ? (state.active === null) : (state.active === state.editing);
    root.innerHTML =
      '<div class="editor-overlay" data-action="overlayClose">' +
        '<div class="editor-sheet">' +
          '<div class="sheet-head"><div class="sheet-title">' + (isNew ? '写下心願' : '修改心願') + '</div><button class="sheet-close" data-action="closeEditor">取消</button></div>' +
          '<div class="field-label">願 文</div>' +
          '<input id="wishTextInput" class="field-input" maxlength="6" placeholder="四字为佳" value="' + escapeAttr(w.text) + '">' +
          '<div class="field-label">為 誰</div>' +
          '<input id="wishMetaInput" class="field-input small" maxlength="10" placeholder="自己 / 母亲 …" value="' + escapeAttr(w.meta) + '">' +
          '<button class="check-row" data-action="toggleDraftActive">' +
            '<span class="check-box" id="wishActiveCheck" data-active="' + (defaultActive ? '1':'0') + '">' + (defaultActive ? '✓' : '') + '</span>' +
            '<span class="check-col"><span class="check-label">以此願承功德</span><span class="check-sub">敲木鱼的功德计入此願，满 99 自动点灯</span></span>' +
          '</button>' +
          '<div class="editor-actions">' +
            '<button class="btn-save" data-action="saveWish">挂 上</button>' +
            (isNew ? '' : '<button class="btn-del" data-action="deleteWish">取 下</button>') +
          '</div>' +
        '</div>' +
      '</div>';
  }

  /* ---------- render: me / settings ---------- */

  function renderMe(){
    var resetInk = state.confirmReset ? '#e6883c' : 'var(--gold)';
    var resetBorder = state.confirmReset ? 'rgba(230,136,60,.5)' : 'rgba(216,171,82,.28)';
    var resetLabel = state.confirmReset ? '再点清零' : '清零';
    var resetNote = state.confirmReset ? '此举将清空累计与今日功德，无法复原。' : '清零后累计与今日功德归零，心願不受影响。';
    return (
      '<div class="page-title">清 修</div>' +
      '<div class="scroll-pad">' +
        '<div class="rows">' +
          '<button class="row" data-action="toggleSound"><div><div class="name">木鱼声</div><div class="sub">SOUND</div></div><div class="val">' + (state.sound?'开':'静音') + '</div></button>' +
          '<button class="row" data-action="toggleHaptic"><div><div class="name">震动</div><div class="sub">HAPTICS</div></div><div class="val">' + (state.haptic?'开':'关') + '</div></button>' +
          '<button class="row" data-action="toggleReminder"><div><div class="name">每日提醒</div><div class="sub">DAILY REMINDER</div></div><div class="val">' + reminderStateText() + '</div></button>' +
          '<div class="row" style="cursor:default"><div><div class="name">提醒时刻</div><div class="sub">TIMES</div></div><div class="val" style="text-align:right">' + reminderTimesText() + '</div></div>' +
          (isStandalone()
            ? '<div class="row" style="cursor:default"><div><div class="name">安装状态</div><div class="sub">INSTALL</div></div><div class="val">已安装</div></div>'
            : '<button class="row" data-action="openInstall"><div><div class="name">安装为 App</div><div class="sub">ADD TO HOME SCREEN</div></div><div class="val">›</div></button>') +
        '</div>' +
        '<button class="sangha-card" data-action="goSangha">' +
          '<div class="sangha-card-top"><div class="lbl">共修</div><div class="arrow">›</div></div>' +
          '<p>今日有 ' + fmt(state.sanghaPeople) + ' 人同敲木鱼，共 ' + fmt(state.sanghaMerit) + ' 功德。</p>' +
        '</button>' +
        '<div class="reset-card" style="border-color:' + resetBorder + '">' +
          '<div class="reset-row">' +
            '<div class="reset-info"><span class="name">重置累计功德</span><span class="sub">RESET TOTAL · 累计 ' + fmt(state.total) + '</span></div>' +
            '<button class="reset-btn" data-action="resetTotal" style="border-color:' + resetBorder + ';color:' + resetInk + '">' + resetLabel + '</button>' +
          '</div>' +
          '<div class="reset-hint">' + resetNote + '</div>' +
        '</div>' +
        '<div class="save-note">功德与心願自动存于本机</div>' +
      '</div>'
    );
  }

  /* ---------- render: sangha ---------- */

  function renderSangha(){
    var dayTotal = state.merits.morning + state.merits.night;
    var pct = dayTotal / state.sanghaMerit;
    var sharePct = (pct*100).toFixed(3) + '%';
    var shareBar = Math.min(100, Math.max(2, pct*900)).toFixed(1) + '%';
    var rank = fmt(Math.max(1, Math.round(state.sanghaPeople * (1 - Math.min(0.98, dayTotal/2600)))));
    var ticker = sanghaTickerData();
    var tickerHtml = ticker.map(function(t){
      return (
        '<div class="ticker-row">' +
          '<div class="avatar">' + t.initial + '</div>' +
          '<div class="who"><span class="n">' + t.name + '</span><span class="p">' + t.place + ' · ' + t.ago + '</span></div>' +
          '<span class="m">+' + t.merit + '</span>' +
        '</div>'
      );
    }).join('');
    return (
      '<div class="sangha-head"><button class="back-btn" data-action="goMe">‹</button><div class="sangha-title">共 修</div></div>' +
      '<div class="scroll-pad">' +
        '<div class="sangha-hero">' +
          '<div class="stat-label">今日共修功德</div>' +
          '<div class="sangha-num">' + fmt(state.sanghaMerit) + '</div>' +
          '<div class="live-row"><div class="live-dot"></div><div style="font-size:11px;letter-spacing:.14em;color:rgba(233,213,177,.5)">' + fmt(state.sanghaPeople) + ' 人正在同敲</div></div>' +
        '</div>' +
        '<div class="share-card">' +
          '<div class="share-card-top"><div class="stat-label">你的一份</div><div style="font-size:13px;color:var(--gold-bright);font-variant-numeric:tabular-nums">' + fmt(dayTotal) + ' · ' + sharePct + '</div></div>' +
          '<div class="progress-track"><div class="progress-fill" style="width:' + shareBar + '"></div></div>' +
          '<div class="rank-note">全部共修者中排第 ' + rank + '</div>' +
        '</div>' +
        '<div class="live-hdr"><div style="font-size:9.5px;letter-spacing:.3em;color:rgba(233,213,177,.4)">此刻 · LIVE</div><div style="font-size:9.5px;letter-spacing:.14em;color:rgba(233,213,177,.28)">自动刷新</div></div>' +
        '<div class="ticker">' + tickerHtml + '</div>' +
        '<div class="tonight-card"><div class="lbl">今夜共修</div><p>21:00 · 千人同敲一百零八声。届时提醒你。</p></div>' +
      '</div>'
    );
  }

  /* ---------- nav ---------- */

  function renderNav(){
    var items = [
      { key:'altar', zh:'木魚', en:'ALTAR' },
      { key:'merit', zh:'功德', en:'MERIT' },
      { key:'wish', zh:'祈願', en:'WISHES' },
      { key:'me', zh:'清修', en:'SELF' }
    ];
    var activeKey = (state.tab === 'sangha') ? 'me' : state.tab;
    document.getElementById('nav').innerHTML = items.map(function(it){
      return '<button class="nav-btn' + (it.key === activeKey ? ' active' : '') + '" data-action="goTab" data-tab="' + it.key + '"><span class="zh">' + it.zh + '</span><span class="en">' + it.en + '</span></button>';
    }).join('');
  }

  /* ---------- dispatch ---------- */

  function bindAltarInputs(){
    var hn = document.getElementById('hallNameInput');
    if(hn){
      hn.addEventListener('input', function(){
        state.hallName = hn.value;
        hn.style.width = hallWidth(hn.value);
        save();
      });
    }
    document.querySelectorAll('.reminder-label-input').forEach(function(inp){
      inp.addEventListener('input', function(){
        var idx = parseInt(inp.getAttribute('data-idx'), 10);
        if(state.reminders[idx]){ state.reminders[idx].label = inp.value; save(); }
      });
    });
  }

  function render(){
    var app = document.getElementById('app');
    if(state.tab === 'altar') app.innerHTML = renderAltar();
    else if(state.tab === 'merit') app.innerHTML = renderMerit();
    else if(state.tab === 'wish') app.innerHTML = renderWish();
    else if(state.tab === 'me') app.innerHTML = renderMe();
    else if(state.tab === 'sangha') app.innerHTML = renderSangha();
    renderNav();
    bindAltarInputs();
    renderModal();
  }

  function goTab(tab){ state.tab = tab; state.scrollOpen = false; render(); }

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.getAttribute('data-action');
    switch(action){
      case 'tapFish': tapFish(); break;
      case 'toggleBurn': toggleBurn(); break;
      case 'dismissBurn': dismissBurn(); break;
      case 'resetToday': resetToday(); break;
      case 'stampShare': stampShare(); break;
      case 'toggleScroll': toggleScroll(); break;
      case 'toggleReminder': toggleReminder(); break;
      case 'goTab': goTab(el.getAttribute('data-tab')); break;
      case 'editWish': openWishEditor(parseInt(el.getAttribute('data-idx'),10)); break;
      case 'addWish': openWishEditor(); break;
      case 'closeEditor': closeEditor(); break;
      case 'saveWish': saveWish(); break;
      case 'deleteWish': deleteWish(); break;
      case 'toggleDraftActive': toggleDraftActive(); break;
      case 'toggleSound': state.sound = !state.sound; save(); render(); break;
      case 'toggleHaptic': state.haptic = !state.haptic; save(); render(); break;
      case 'resetTotal': resetTotal(); break;
      case 'toggleReminderRow': {
        var rIdx = parseInt(el.getAttribute('data-idx'), 10);
        if(state.reminders[rIdx]) state.reminders[rIdx].on = !state.reminders[rIdx].on;
        save(); renderAltarLive();
        break;
      }
      case 'shiftReminder': {
        var sIdx = parseInt(el.getAttribute('data-idx'), 10);
        var delta = parseInt(el.getAttribute('data-delta'), 10);
        if(state.reminders[sIdx]) state.reminders[sIdx].m = ((state.reminders[sIdx].m + delta) % 1440 + 1440) % 1440;
        save(); renderAltarLive();
        break;
      }
      case 'removeReminder': {
        var xIdx = parseInt(el.getAttribute('data-idx'), 10);
        state.reminders = state.reminders.filter(function(_, j){ return j !== xIdx; });
        save(); renderAltarLive();
        break;
      }
      case 'addReminder': {
        var nextM = state.reminders.length
          ? (Math.max.apply(null, state.reminders.map(function(r){ return r.m; })) + 180) % 1440
          : 720;
        state.reminders.push({ m: nextM, on: true, label: slotLabel(nextM) });
        save(); renderAltarLive();
        break;
      }
      case 'goSangha': goTab('sangha'); break;
      case 'goMe': goTab('me'); break;
      case 'overlayClose': if(e.target === el) closeEditor(); break;
      case 'openInstall': openInstallPrompt(); break;
      case 'doInstall': doInstall(); break;
      case 'closeInstall': closeInstallPrompt(el.getAttribute('data-remember') === '1'); break;
      case 'overlayCloseInstall': if(e.target === el) closeInstallPrompt(true); break;
    }
  });

  /* ---------- init ---------- */

  load();
  render();
  setInterval(checkReminder, 60*1000);
  checkReminder();
  if(state.reminderOn && 'Notification' in window && Notification.permission === 'granted'){
    registerPeriodicSync();
  }

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('mokugyo-sw.js').catch(function(){ /* offline install still works without it */ });
  }

  if(isIOS() && !isStandalone() && !installDismissed()){
    setTimeout(function(){
      if(!state.installOpen){
        state.installOpen = true;
        state.installMode = 'ios';
        renderInstallModal();
      }
    }, 1500);
  }

  setInterval(function(){
    var t = todayStr();
    if(state.day !== t){ rollDayIfNeeded(); save(); render(); }
  }, 30000);
})();
</script>
</body>
</html>
